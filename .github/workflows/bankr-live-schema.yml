name: Probe live Bankr x402 schema

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bankr-live-schema.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live Bankr schemas
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://x402.bankr.bot/0xe100c45ad23fa81aeca03ce61871e2ea3cf8e9eb'
          for name in youtube-transcript youtube-captions youtube-subtitles youtube-video-to-text video-transcript youtube-metadata youtube-transcript-batch; do
            echo "===== SCHEMA: $name ====="
            npx --yes @bankr/cli x402 schema "$BASE/$name" --raw || true
          done

      - name: Probe direct HTTP status
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://x402.bankr.bot/0xe100c45ad23fa81aeca03ce61871e2ea3cf8e9eb'
          for name in youtube-transcript youtube-captions youtube-subtitles youtube-video-to-text video-transcript youtube-metadata youtube-transcript-batch; do
            code=$(curl -sS -o /tmp/body.json -w '%{http_code}' -X POST "$BASE/$name" -H 'content-type: application/json' --data '{"url":"https://www.youtube.com/watch?v=dQw4w9WgXcQ"}')
            echo "HTTP $name=$code"
            head -c 1000 /tmp/body.json || true
            echo
          done

      - name: Probe Bankr search
        shell: bash
        run: |
          set -euo pipefail
          for q in 'youtube transcript' 'youtube captions' 'youtube subtitles' 'video transcript' 'youtube video to text'; do
            echo "===== SEARCH: $q ====="
            npx --yes @bankr/cli x402 search "$q" --raw || true
          done
