name: Probe live Bankr x402 schema

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bankr-live-schema.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      WALLET: '0xe100c45ad23fa81aeca03ce61871e2ea3cf8e9eb'
    steps:
      - name: Inspect live Bankr schemas
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://x402.bankr.bot/$WALLET"
          for name in youtube-transcript youtube-captions youtube-video-to-text; do
            echo "===== SCHEMA: $name ====="
            npx --yes @bankr/cli x402 schema "$BASE/$name" --raw || true
          done

      - name: Probe direct HTTP status
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://x402.bankr.bot/$WALLET"
          for name in youtube-transcript youtube-captions youtube-video-to-text; do
            code=$(curl -sS -o /tmp/body.json -w '%{http_code}' -X POST "$BASE/$name" -H 'content-type: application/json' --data '{"url":"https://www.youtube.com/watch?v=dQw4w9WgXcQ"}')
            echo "HTTP $name=$code"
            if [ "$code" = '402' ]; then
              echo "  STATUS: ACTIVE (returns 402 payment challenge)"
            else
              echo "  STATUS: UNEXPECTED ($code)"
              head -c 500 /tmp/body.json || true
            fi
            echo ""
          done

      - name: Probe Bankr marketplace search
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================="
          echo "MARKETPLACE SEARCH PROBE"
          echo "Wallet: $WALLET"
          echo "========================================="
          for q in 'youtube transcript' 'youtube captions' 'youtube subtitles' 'video transcript' 'youtube video to text'; do
            echo "===== SEARCH: \"$q\" ====="
            npx --yes @bankr/cli x402 search "$q" --raw 2>&1 || true
            echo ""
          done
