name: x402 Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      WALLET: '0xe100c45ad23fa81aeca03ce61871e2ea3cf8e9eb'
    steps:
      - uses: actions/checkout@v4

      - name: Validate x402 config has all active services
        shell: bash
        run: |
          set -euo pipefail
          node -e "
            const c = require('./bankr.x402.json');
            const names = Object.keys(c.services);
            const required = ['youtube-transcript', 'youtube-captions', 'youtube-video-to-text'];
            for (const n of required) {
              if (!names.includes(n)) { console.error('MISSING SERVICE:', n); process.exit(1); }
              if (c.services[n].price !== '0.004') { console.error('WRONG PRICE:', n, c.services[n].price); process.exit(2); }
              if (!c.services[n].description) { console.error('MISSING DESCRIPTION:', n); process.exit(3); }
              if (!c.services[n].tags || c.services[n].tags.length === 0) { console.error('MISSING TAGS:', n); process.exit(4); }
              if (!c.services[n].schema || !c.services[n].schema.input) { console.error('MISSING INPUT SCHEMA:', n); process.exit(5); }
            }
            console.log('CONFIG_VALID=YES');
            console.log('SERVICES:', names.join(', '));
            console.log('ACTIVE_SERVICES_REQUIRED:', required.join(', '));
          "

      - name: Verify paid endpoint advertises HTTP 402
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://x402.bankr.bot/${WALLET}"
          for name in youtube-transcript youtube-captions youtube-video-to-text; do
            STATUS=$(curl -sS -o /tmp/x402_${name}.json -w '%{http_code}' -X POST "$BASE/$name" \
              -H 'Content-Type: application/json' \
              --data '{"url":"https://www.youtube.com/watch?v=dQw4w9WgXcQ"}')
            echo "$name HTTP=$STATUS"
            if [ "$STATUS" != '402' ]; then
              echo "EXPECTED 402, GOT $STATUS"
              cat /tmp/x402_${name}.json
              exit 1
            fi
          done
          echo "ALL_ENDPOINTS_ACTIVE=YES"

      - name: Install all active transcript handlers
        shell: bash
        run: |
          for name in youtube-transcript youtube-captions youtube-video-to-text; do
            npm install --prefix "x402/$name"
          done

      - name: Execute every handler against YouTube
        shell: bash
        run: |
          for name in youtube-transcript youtube-captions youtube-video-to-text; do
            echo "TESTING=$name"
            npx --yes tsx -e "
              import handler from './x402/$name/index.ts';
              (async () => {
                const req = new Request('http://local', {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({ url: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ' })
                });
                const res = await handler(req);
                const data = await res.json();
                console.log('$name', 'status=' + res.status, 'words=' + data.wordCount, 'success=' + data.success);
                if (res.status !== 200 || !data.success || !data.transcript || data.wordCount < 10) {
                  console.error('HANDLER_FAILED:', '$name');
                  process.exit(1);
                }
              })();
            "
          done
          echo "ALL_HANDLERS_PASS=YES"

      - name: Probe marketplace discovery for our services
        shell: bash
        run: |
          set -euo pipefail
          FOUND_COUNT=0
          NOT_FOUND_COUNT=0
          echo "========================================="
          echo "DISCOVERY VERIFICATION REPORT"
          echo "Wallet: $WALLET"
          echo "========================================="
          echo ""
          for q in \
            'youtube transcript' \
            'youtube transcript api' \
            'youtube captions' \
            'youtube subtitles' \
            'youtube transcription' \
            'video transcript' \
            'youtube video to text' \
            'transcribe youtube video' \
            'youtube-to-text' \
            'extract youtube captions' \
            'transcript for LLM' \
            'transcript for RAG' \
            'video transcription' \
            'youtube transcript tool'; do
            echo "--- QUERY: \"$q\" ---"
            npx --yes @bankr/cli x402 search "$q" --raw > /tmp/search.json 2>&1 || true
            if grep -qi "$WALLET" /tmp/search.json; then
              echo "FOUND_OUR_SERVICE=YES"
              FOUND_COUNT=$((FOUND_COUNT + 1))
            else
              echo "FOUND_OUR_SERVICE=NO"
              NOT_FOUND_COUNT=$((NOT_FOUND_COUNT + 1))
            fi
            echo ""
          done
          echo "========================================="
          echo "DISCOVERY SUMMARY"
          echo "FOUND:     $FOUND_COUNT / $((FOUND_COUNT + NOT_FOUND_COUNT)) queries"
          echo "NOT FOUND: $NOT_FOUND_COUNT / $((FOUND_COUNT + NOT_FOUND_COUNT)) queries"
          echo ""
          if [ "$FOUND_COUNT" -gt 0 ]; then
            echo "MARKETPLACE_DISCOVERABLE=YES"
          else
            echo "MARKETPLACE_DISCOVERABLE=NO"
            echo "NOTE: Endpoints may be ACTIVE but not yet APPROVED for marketplace indexing."
            echo "Deploy triggers indexing, but Bankr approval is required for discoverability."
          fi
          echo "========================================="
