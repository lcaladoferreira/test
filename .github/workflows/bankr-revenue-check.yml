name: Bankr Revenue Check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bankr-revenue-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Bankr discovery
        shell: bash
        run: |
          set -euo pipefail
          WALLET_SERVICE='0xe100c45ad23fa81aeca03ce61871e2ea3cf8e9eb'
          for q in 'youtube transcript' 'youtube captions' 'youtube transcription' 'youtube subtitles' 'youtube video to text' 'youtube transcript api'; do
            echo "===== $q ====="
            npx --yes @bankr/cli x402 search "$q" --raw > /tmp/search.json || true
            if grep -qi "$WALLET_SERVICE" /tmp/search.json; then
              echo "DISCOVERY_FOUND=$q"
            else
              echo "DISCOVERY_NOT_FOUND=$q"
            fi
          done

      - name: Check Base USDC incoming transfers
        shell: bash
        run: |
          set -euo pipefail
          WALLET='0x8AEE621035D93Deb3C0C1177fac252dC2dd501a0'
          API="https://base.blockscout.com/api/v2/addresses/$WALLET/token-transfers?type=ERC-20"
          curl -sS "$API" > /tmp/transfers.json
          python - <<'PY'
          import json
          p='/tmp/transfers.json'
          d=json.load(open(p))
          items=d.get('items',[])
          wallet='0x8aee621035d93deb3c0c1177fac252dc2dd501a0'
          usdc='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
          found=[]
          for x in items:
              to=((x.get('to') or {}).get('hash') or '').lower()
              token=((x.get('token') or {}).get('address_hash') or (x.get('token') or {}).get('address') or '').lower()
              if to==wallet and token==usdc:
                  found.append(x)
          print('INCOMING_USDC_COUNT='+str(len(found)))
          for x in found[:20]:
              print(json.dumps({
                  'timestamp': x.get('timestamp'),
                  'tx_hash': x.get('transaction_hash'),
                  'from': (x.get('from') or {}).get('hash'),
                  'to': (x.get('to') or {}).get('hash'),
                  'total': x.get('total'),
                  'token': x.get('token')
              }, default=str))
          PY
