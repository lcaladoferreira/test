name: Bankr Revenue Check

on:
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Bankr discovery
        shell: bash
        run: |
          set -euo pipefail
          WALLET_SERVICE='0xe100c45ad23fa81aeca03ce61871e2ea3cf8e9eb'
          for q in 'youtube transcript' 'youtube captions' 'youtube transcription' 'youtube subtitles' 'video transcript' 'youtube video to text' 'youtube transcript api'; do
            echo "===== $q ====="
            npx --yes @bankr/cli x402 search "$q" --raw > /tmp/search.json || true
            if grep -qi "$WALLET_SERVICE" /tmp/search.json; then
              echo "DISCOVERY_FOUND=$q"
            else
              echo "DISCOVERY_NOT_FOUND=$q"
            fi
          done

      - name: Revenue by Bankr endpoint
        env:
          BANKR_API_KEY: ${{ secrets.BANKR_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICES=(
            youtube-transcript
            youtube-captions
            youtube-subtitles
            youtube-video-to-text
            video-transcript
            youtube-metadata
            youtube-transcript-batch
          )
          for service in "${SERVICES[@]}"; do
            echo "===== REVENUE: $service ====="
            npx --yes @bankr/cli x402 revenue "$service" || true
          done

      - name: Explain settlement-wallet exclusion
        shell: bash
        run: |
          echo 'Revenue is intentionally measured with `bankr x402 revenue <service>`.'
          echo 'The shared settlement wallet is not used as a product-revenue proxy because unrelated x402 services can settle to the same address.'
