name: Register x402 services on 402 Index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/register-402index.yml'
      - 'bankr.x402.json'
      - 'x402/**'

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Submit services
        shell: bash
        run: |
          set -euo pipefail
          submit() {
            local name="$1"
            local url="$2"
            echo "Submitting: $name"
            curl -sS -X POST 'https://402index.io/api/v1/register' \
              -H 'Content-Type: application/json' \
              --data "{\"url\":\"$url\",\"name\":\"$name\",\"protocol\":\"x402\",\"http_method\":\"POST\",\"probe_body\":\"{\\\"url\\\":\\\"https://www.youtube.com/watch?v=dQw4w9WgXcQ\\\"}\"}" \
              | tee /tmp/last-response.json
            echo
          }

          BASE='https://x402.bankr.bot/0xe100c45ad23fa81aeca03ce61871e2ea3cf8e9eb'
          submit 'YouTube Transcript API' "$BASE/youtube-transcript"
          submit 'Cheap YouTube Transcript API' "$BASE/youtube-transcript-basic"
          submit 'YouTube Transcribe API' "$BASE/youtube-transcribe"
          submit 'YouTube Transcript API Alias' "$BASE/youtube-transcript-api"
          submit 'YouTube Captions API' "$BASE/youtube-captions"
          submit 'YouTube Subtitles API' "$BASE/youtube-subtitles"
          submit 'YouTube Video to Text API' "$BASE/youtube-video-to-text"
          submit 'Video Transcript API' "$BASE/video-transcript"
          submit 'YouTube Metadata API' "$BASE/youtube-metadata"
          submit 'YouTube Transcript Batch API' "$BASE/youtube-transcript-batch"
