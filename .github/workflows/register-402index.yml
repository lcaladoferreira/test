name: Register x402 services on 402 Index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/register-402index.yml'

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Submit verified live services
        shell: bash
        run: |
          set -euo pipefail
          submit() {
            local name="$1"
            local url="$2"
            echo "Submitting: $name -> $url"
            code=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
              -X POST 'https://402index.io/api/v1/register' \
              -H 'Content-Type: application/json' \
              --data "{\"url\":\"$url\",\"name\":\"$name\",\"protocol\":\"x402\",\"http_method\":\"POST\",\"probe_body\":\"{\\\"url\\\":\\\"https://www.youtube.com/watch?v=dQw4w9WgXcQ\\\"}\"}")
            echo "HTTP_STATUS=$code"
            cat /tmp/response.json || true
            echo
            case "$code" in
              200|201|202) ;;
              *) echo "Registration failed for $name"; return 1 ;;
            esac
          }

          BASE='https://x402.bankr.bot/0xe100c45ad23fa81aeca03ce61871e2ea3cf8e9eb'
          submit 'YouTube Transcript API for AI Agents' "$BASE/youtube-transcript"
          submit 'YouTube Captions API for AI Agents' "$BASE/youtube-captions"
          submit 'YouTube Video to Text API for AI Agents' "$BASE/youtube-video-to-text"
