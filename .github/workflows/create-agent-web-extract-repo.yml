name: Create standalone Agent Web Extract repository

on:
  push:
    branches:
      - agent-web-extract-accidental-backup-20260916
    paths:
      - '.github/workflows/create-agent-web-extract-repo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create standalone repository if GitHub token permits account-level creation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          owner='lcaladoferreira'
          repo='agent-web-extract'
          api='https://api.github.com'
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')

          code=$(curl -sS -o /tmp/existing.json -w '%{http_code}' "${auth[@]}" "$api/repos/$owner/$repo")
          if [ "$code" = '200' ]; then
            echo "REPO_ALREADY_EXISTS=https://github.com/$owner/$repo"
            exit 0
          fi

          code=$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST "${auth[@]}" "$api/user/repos" \
            -d '{"name":"agent-web-extract","description":"Paid real-time web extraction and normalization for autonomous AI agents via x402 / Base / USDC.","private":false,"has_issues":true,"has_projects":false,"has_wiki":false,"auto_init":false}')
          cat /tmp/create.json
          echo
          if [ "$code" != '201' ]; then
            echo "CREATE_REPO_HTTP=$code"
            exit 1
          fi
          echo "CREATED=https://github.com/$owner/$repo"
