name: Deploy Bankr x402

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bankr.x402.json'
      - 'x402/youtube-transcript-basic/**'
      - 'x402/youtube-transcript/**'
      - 'x402/youtube-captions/**'
      - 'x402/youtube-subtitles/**'
      - 'x402/youtube-video-to-text/**'
      - 'x402/youtube-metadata/**'
      - 'x402/youtube-transcript-batch/**'
      - '.github/workflows/deploy-bankr-x402.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy all x402 services to Bankr
        env:
          BANKR_API_KEY: ${{ secrets.BANKR_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BANKR_API_KEY:-}" || { echo 'BANKR_API_KEY secret is missing'; exit 1; }
          npx --yes @bankr/cli x402 deploy

      - name: Verify live endpoints advertise HTTP 402
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://x402.bankr.bot/0xe100c45ad23fa81aeca03ce61871e2ea3cf8e9eb'

          check_402() {
            local name="$1"
            local body="$2"
            local code
            code=$(curl -sS -o "/tmp/resp_${name}.json" -w '%{http_code}' -X POST "$BASE/$name" -H 'content-type: application/json' --data "$body")
            echo "$name HTTP=$code"
            if [ "$code" != '402' ]; then
              echo "ERROR: $name returned $code instead of 402"
              cat "/tmp/resp_${name}.json"
              exit 1
            fi
          }

          SINGLE='{"url":"https://www.youtube.com/watch?v=dQw4w9WgXcQ"}'
          BATCH='{"videos":["https://www.youtube.com/watch?v=dQw4w9WgXcQ","https://www.youtube.com/watch?v=9bZkp7q19f0"]}'

          check_402 youtube-transcript-basic "$SINGLE"
          check_402 youtube-transcript "$SINGLE"
          check_402 youtube-captions "$SINGLE"
          check_402 youtube-subtitles "$SINGLE"
          check_402 youtube-video-to-text "$SINGLE"
          check_402 youtube-metadata "$SINGLE"
          check_402 youtube-transcript-batch "$BATCH"

          echo "ALL 7 PAID ENDPOINTS RETURN 402 - DEPLOYED AND ACTIVE"
