name: x402 Market Watch

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      WALLET: '0xe100c45ad23fa81aeca03ce61871e2ea3cf8e9eb'
      BASE_URL: 'https://x402.bankr.bot/0xe100c45ad23fa81aeca03ce61871e2ea3cf8e9eb'
    steps:
      - name: Check 402 Index listing status
        shell: bash
        run: |
          set -euo pipefail
          for id in \
            2fd8e5bf-9ec1-4570-95a4-51d2d7e3fae1 \
            10f74450-d844-4198-bd56-b2189316e673 \
            2c1afa9e-295b-44bf-bb26-65ab95f7d1d5; do
            echo "===== 402INDEX $id ====="
            curl -sS "https://402index.io/api/v1/services/$id" || true
            echo
          done

      - name: Check 402 Index x402 opportunities
        shell: bash
        run: |
          set -euo pipefail
          echo '===== X402 OPPORTUNITIES ====='
          curl -sS 'https://402index.io/api/v1/opportunities?protocol=x402' || true
          echo

      - name: Check Bankr marketplace discovery
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================="
          echo "BANKR MARKETPLACE DISCOVERY CHECK"
          echo "Wallet: $WALLET"
          echo "========================================="
          FOUND=0
          TOTAL=0
          for q in \
            'youtube transcript' \
            'youtube transcript api' \
            'youtube captions' \
            'youtube subtitles' \
            'youtube metadata' \
            'youtube transcription' \
            'video transcript' \
            'youtube video to text' \
            'transcribe youtube video' \
            'transcript for LLM' \
            'transcript for RAG' \
            'batch youtube transcript'; do
            TOTAL=$((TOTAL + 1))
            echo "--- QUERY: \"$q\" ---"
            npx --yes @bankr/cli x402 search "$q" --raw > /tmp/search.json 2>&1 || true
            if grep -qi "$WALLET" /tmp/search.json; then
              echo "FOUND_OUR_SERVICE=YES"
              FOUND=$((FOUND + 1))
            else
              echo "FOUND_OUR_SERVICE=NO"
            fi
          done
          echo "BANKR_DISCOVERY_MATCHES=$FOUND/$TOTAL"

      - name: Check x402-list public index
        shell: bash
        run: |
          set -euo pipefail
          echo '===== X402-LIST ====='
          for page in 1 2 3 4 5; do
            curl -sS "https://x402-list.com/api/v1/services?page=$page&limit=100" > "/tmp/x402list_$page.json" || true
          done
          cat /tmp/x402list_*.json > /tmp/x402list_all.txt
          if grep -qi "$WALLET\|x402 YouTube Transcript API\|youtube-transcript" /tmp/x402list_all.txt; then
            echo 'X402_LIST_DISCOVERABLE=YES'
            grep -ioE '.{0,120}(youtube-transcript|x402 YouTube Transcript API|0xe100c45ad23fa81aeca03ce61871e2ea3cf8e9eb).{0,220}' /tmp/x402list_all.txt | head -20 || true
          else
            echo 'X402_LIST_DISCOVERABLE=NO'
          fi

      - name: Check x402.direct public index
        shell: bash
        run: |
          set -euo pipefail
          echo '===== X402.DIRECT ====='
          for page in 1 2 3 4 5; do
            curl -sS "https://x402.direct/api/services?page=$page&limit=100&sort=newest" > "/tmp/x402direct_$page.json" || true
          done
          cat /tmp/x402direct_*.json > /tmp/x402direct_all.txt
          if grep -qi "$WALLET\|x402 YouTube Transcript API\|youtube-transcript" /tmp/x402direct_all.txt; then
            echo 'X402_DIRECT_DISCOVERABLE=YES'
            grep -ioE '.{0,120}(youtube-transcript|x402 YouTube Transcript API|0xe100c45ad23fa81aeca03ce61871e2ea3cf8e9eb).{0,220}' /tmp/x402direct_all.txt | head -20 || true
          else
            echo 'X402_DIRECT_DISCOVERABLE=NO'
          fi

      - name: Verify live Bankr 402 endpoints
        shell: bash
        run: |
          set -euo pipefail
          SINGLE='{"url":"https://www.youtube.com/watch?v=dQw4w9WgXcQ"}'
          for name in youtube-transcript youtube-captions youtube-video-to-text; do
            code=$(curl -sS -o "/tmp/${name}.json" -w '%{http_code}' -X POST "$BASE_URL/$name" -H 'content-type: application/json' --data "$SINGLE")
            echo "$name HTTP=$code"
          done

      - name: Validate all seven payment requirements without paying
        if: always()
        shell: python
        run: |
          import base64, json, os, urllib.request, urllib.error
          wallet = os.environ["WALLET"]
          base = os.environ["BASE_URL"]
          prices = {"youtube-transcript-basic":1100,"youtube-transcript":4000,"youtube-captions":4000,"youtube-subtitles":4000,"youtube-video-to-text":4000,"youtube-metadata":2000,"youtube-transcript-batch":10000}
          for name, amount in prices.items():
              body = {"videos":["dQw4w9WgXcQ","9bZkp7q19f0"]} if name.endswith("-batch") else {"videoId":"dQw4w9WgXcQ"}
              row = {"route": name, "expectedAtomicUSDC": amount}
              try:
                  req = urllib.request.Request(base+"/"+name, data=json.dumps(body).encode(), headers={"Content-Type":"application/json"})
                  try:
                      response = urllib.request.urlopen(req, timeout=25)
                  except urllib.error.HTTPError as error:
                      response = error
                  row["http"] = response.code
                  raw = response.read(262144)
                  header = response.headers.get("PAYMENT-REQUIRED")
                  payment = json.loads(base64.b64decode(header)) if header else json.loads(raw)
                  accepts = payment.get("accepts", [])
                  row["requirements"] = [{k:a.get(k) for k in ("scheme","network","asset","amount","maxAmountRequired","payTo","maxTimeoutSeconds")} for a in accepts]
                  row["paymentValid"] = response.code == 402 and any(
                      a.get("scheme") == "exact"
                      and a.get("network") in ("base","eip155:8453")
                      and str(a.get("amount",a.get("maxAmountRequired"))) == str(amount)
                      and str(a.get("asset","")).lower() == "0x833589fcd6edb6e08f4c7c32d4f71b54bda02913"
                      and str(a.get("payTo","")).lower() == wallet.lower()
                      and isinstance(a.get("maxTimeoutSeconds"), (int,float)) and a["maxTimeoutSeconds"] > 0
                      for a in accepts)
                  row["resourcePresent"] = bool(payment.get("resource",{}).get("url")) if isinstance(payment.get("resource"),dict) else False
                  row["bazaarPresent"] = bool(payment.get("extensions",{}).get("bazaar"))
              except Exception as error:
                  row["errorType"] = type(error).__name__
                  row["paymentValid"] = False
              print(json.dumps(row), flush=True)
