name: Base USDC Settlement Wallet Diagnostic

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect shared Bankr settlement wallet activity without revenue attribution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, datetime

          RPC='https://mainnet.base.org'
          USDC='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
          WALLET='8aee621035d93deb3c0c1177fac252dc2dd501a0'
          TOPIC0='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'
          TOPIC2='0x' + ('0'*24) + WALLET

          def rpc(method, params):
              data=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode()
              req=urllib.request.Request(RPC,data=data,headers={'content-type':'application/json','user-agent':'github-actions-usdc-diagnostic'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  out=json.load(r)
              if 'error' in out:
                  raise RuntimeError(out['error'])
              return out['result']

          latest=int(rpc('eth_blockNumber',[]),16)
          start=max(0, latest-45000)
          logs=[]
          step=4000
          for a in range(start, latest+1, step):
              b=min(latest,a+step-1)
              flt={'address':USDC,'fromBlock':hex(a),'toBlock':hex(b),'topics':[TOPIC0,None,TOPIC2]}
              logs.extend(rpc('eth_getLogs',[flt]))

          rows=[]
          for log in logs:
              amount=int(log['data'],16)/1_000_000
              block=int(log['blockNumber'],16)
              blk=rpc('eth_getBlockByNumber',[hex(block),False])
              ts=int(blk['timestamp'],16)
              rows.append({
                  'time_utc': datetime.datetime.fromtimestamp(ts, datetime.timezone.utc).isoformat(),
                  'amount_usdc': amount,
                  'tx_hash': log['transactionHash'],
                  'block': block,
              })
          rows.sort(key=lambda x:x['block'])
          print('SETTLEMENT_WALLET_ACTIVITY_ONLY=true')
          print('DO_NOT_ATTRIBUTE_TO_OUR_SERVICES=true')
          print('LATEST_BLOCK', latest)
          print('WINDOW_START_BLOCK', start)
          print('INCOMING_USDC_COUNT', len(rows))
          for r in rows:
              print(json.dumps(r, separators=(',',':')))
          print('Revenue attribution must use Bankr endpoint-level revenue reporting, not wallet deposit amounts.')
          PY
