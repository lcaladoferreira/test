name: Register services on x402-list

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/register-x402-list.yml'
      - 'bankr.x402.json'
      - 'x402/**'

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Submit Bankr YouTube service family
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(cat <<'JSON'
          {
            "url": "https://x402.bankr.bot/0xe100c45ad23fa81aeca03ce61871e2ea3cf8e9eb",
            "email": "83848600+lcaladoferreira@users.noreply.github.com",
            "service_name": "YouTube AI Data APIs",
            "description": "Low-cost x402 APIs for AI agents: YouTube transcript, cheap transcript text, transcribe/transcription, captions, subtitles, video transcript/video-to-text, metadata and batch transcript processing. USDC on Base; transcript calls settle only on successful delivery.",
            "website_url": "https://github.com/lcaladoferreira/test",
            "category": "AI",
            "endpoints": [
              "/youtube-transcript",
              "/youtube-transcript-basic",
              "/youtube-transcribe",
              "/youtube-transcript-api",
              "/youtube-captions",
              "/youtube-subtitles",
              "/youtube-video-to-text",
              "/video-transcript",
              "/youtube-metadata",
              "/youtube-transcript-batch"
            ],
            "notes": "Hosted on Bankr x402 Cloud. Budget transcript $0.0011; premium transcript aliases $0.004; metadata $0.002; batch $0.010. JSON/text/SRT, language selection, timestamps, manual/generated caption preference and optional translation are supported where applicable."
          }
          JSON
          )
          CODE=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
            -X POST 'https://x402-list.com/api/v1/submit' \
            -H 'Content-Type: application/json' \
            --data "$BODY")
          echo "HTTP_STATUS=$CODE"
          cat /tmp/response.json
          echo
          if [ "$CODE" = "201" ]; then
            echo 'SUBMISSION_ACCEPTED=YES'
          elif [ "$CODE" = "402" ]; then
            echo 'SUBMISSION_ACCEPTED=NO_FEE_REQUIRED'
          else
            echo 'SUBMISSION_ACCEPTED=NO'
            exit 1
          fi
