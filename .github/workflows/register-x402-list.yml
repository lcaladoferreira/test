name: Register services on x402-list

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/register-x402-list.yml'
      - 'bankr.x402.json'
      - 'x402/youtube-transcript-basic/**'
      - 'x402/youtube-transcript/**'
      - 'x402/youtube-captions/**'
      - 'x402/youtube-subtitles/**'
      - 'x402/youtube-video-to-text/**'
      - 'x402/youtube-metadata/**'
      - 'x402/youtube-transcript-batch/**'

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Submit complete YouTube x402 service family
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(cat <<'JSON'
          {
            "url": "https://x402.bankr.bot/0xe100c45ad23fa81aeca03ce61871e2ea3cf8e9eb",
            "email": "83848600+lcaladoferreira@users.noreply.github.com",
            "service_name": "x402 YouTube Transcript API",
            "description": "Machine-payable YouTube transcript, captions, subtitles, metadata, video-to-text and batch APIs for autonomous agents. USDC on Base, no signup or API key. Designed for RAG ingestion, LLM context, research, summarization, media intelligence and automated workflows. Prices range from $0.0011 to $0.010 USDC per request depending on route.",
            "website_url": "https://github.com/lcaladoferreira/test",
            "category": "AI",
            "endpoints": [
              "/youtube-transcript-basic",
              "/youtube-transcript",
              "/youtube-captions",
              "/youtube-subtitles",
              "/youtube-video-to-text",
              "/youtube-metadata",
              "/youtube-transcript-batch"
            ],
            "notes": "Hosted on Bankr x402 Cloud. Payment protocol: x402; network: Base; asset: USDC. Route pricing: transcript-basic $0.0011, transcript $0.004, captions $0.004, subtitles $0.004, video-to-text $0.004, metadata $0.002, transcript-batch $0.010. Machine-readable docs: https://github.com/lcaladoferreira/test/blob/main/openapi.json and https://github.com/lcaladoferreira/test/blob/main/SKILL.md"
          }
          JSON
          )
          CODE=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
            -X POST 'https://x402-list.com/api/v1/submit' \
            -H 'Content-Type: application/json' \
            --data "$BODY")
          echo "HTTP_STATUS=$CODE"
          cat /tmp/response.json
          echo
          if [ "$CODE" = "201" ]; then
            echo 'SUBMISSION_ACCEPTED=YES'
          elif [ "$CODE" = "402" ]; then
            echo 'SUBMISSION_ACCEPTED=NO_FEE_REQUIRED'
          else
            echo 'SUBMISSION_ACCEPTED=NO'
          fi
