name: Register services on x402-list

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/register-x402-list.yml'

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Submit Bankr YouTube service family
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://x402.bankr.bot/0xe100c45ad23fa81aeca03ce61871e2ea3cf8e9eb'
          BODY=$(cat <<'JSON'
          {
            "url": "https://x402.bankr.bot/0xe100c45ad23fa81aeca03ce61871e2ea3cf8e9eb",
            "email": "83848600+lcaladoferreira@users.noreply.github.com",
            "service_name": "YouTube AI Data APIs",
            "description": "Low-cost x402 APIs for AI agents: YouTube transcript, captions/subtitles, video-to-text, metadata and batch transcript processing. USDC on Base; transcript calls settle only on successful delivery.",
            "website_url": "https://github.com/lcaladoferreira/test",
            "category": "AI",
            "endpoints": [
              "POST /youtube-transcript",
              "POST /youtube-captions",
              "POST /youtube-video-to-text",
              "POST /youtube-metadata",
              "POST /youtube-transcript-batch"
            ],
            "notes": "Hosted on Bankr x402 Cloud. Transcript $0.004, metadata $0.002, batch $0.010. JSON/text/SRT, language selection, manual/generated caption preference and optional translation are supported where applicable."
          }
          JSON
          )
          CODE=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
            -X POST 'https://x402-list.com/api/v1/submit' \
            -H 'Content-Type: application/json' \
            --data "$BODY")
          echo "HTTP_STATUS=$CODE"
          cat /tmp/response.json
          echo
          # 201 = queued for review. 402 = fee required; do not pay automatically.
          if [ "$CODE" = "201" ]; then
            echo 'SUBMISSION_ACCEPTED=YES'
          elif [ "$CODE" = "402" ]; then
            echo 'SUBMISSION_ACCEPTED=NO_FEE_REQUIRED'
          else
            echo 'SUBMISSION_ACCEPTED=NO'
            exit 1
          fi
