name: Register services on x402-list

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/register-x402-list.yml'
      - 'bankr.x402.json'
      - 'x402/youtube-transcript/**'
      - 'x402/youtube-captions/**'
      - 'x402/youtube-video-to-text/**'

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Submit YouTube transcript service family
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(cat <<'JSON'
          {
            "url": "https://x402.bankr.bot/0xe100c45ad23fa81aeca03ce61871e2ea3cf8e9eb",
            "email": "83848600+lcaladoferreira@users.noreply.github.com",
            "service_name": "YouTube Transcript APIs for AI Agents",
            "description": "Pay-per-call YouTube transcript, captions and video-to-text APIs for AI agents. USDC on Base. No signup. For RAG ingestion, LLM context, research, summarization and automation. $0.004 per successful request.",
            "website_url": "https://github.com/lcaladoferreira/test",
            "category": "AI",
            "endpoints": [
              "/youtube-transcript",
              "/youtube-captions",
              "/youtube-video-to-text"
            ],
            "notes": "Hosted on Bankr x402 Cloud. $0.004 USDC per request on Base. JSON/text/SRT output, language selection, timestamps, manual/generated caption preference and optional translation (youtube-transcript). Payments settle on-chain only after successful response."
          }
          JSON
          )
          CODE=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
            -X POST 'https://x402-list.com/api/v1/submit' \
            -H 'Content-Type: application/json' \
            --data "$BODY")
          echo "HTTP_STATUS=$CODE"
          cat /tmp/response.json
          echo
          if [ "$CODE" = "201" ]; then
            echo 'SUBMISSION_ACCEPTED=YES'
          elif [ "$CODE" = "402" ]; then
            echo 'SUBMISSION_ACCEPTED=NO_FEE_REQUIRED'
          else
            echo 'SUBMISSION_ACCEPTED=NO'
          fi
