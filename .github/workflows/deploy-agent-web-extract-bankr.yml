name: Deploy Agent Web Extract to Bankr x402

on:
  push:
    branches:
      - agent-web-extract-accidental-backup-20260916
    paths:
      - 'x402/web-extract/**'
      - 'bankr.x402.json'
      - '.github/workflows/deploy-agent-web-extract-bankr.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy only Agent Web Extract
        env:
          BANKR_API_KEY: ${{ secrets.BANKR_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BANKR_API_KEY:-}" || { echo 'BANKR_API_KEY secret is missing'; exit 1; }
          npx --yes @bankr/cli x402 deploy web-extract

      - name: Verify live x402 challenge and discovery schema
        shell: bash
        run: |
          set -euo pipefail
          URL='https://x402.bankr.bot/0xe100c45ad23fa81aeca03ce61871e2ea3cf8e9eb/web-extract'
          BODY='{"url":"https://example.com","format":"json","includeLinks":true,"includeMetadata":true,"maxChars":30000}'

          code=$(curl -sS -D /tmp/headers.txt -o /tmp/body.json -w '%{http_code}' \
            -X POST "$URL" -H 'content-type: application/json' --data "$BODY")

          echo "HTTP=$code"
          cat /tmp/headers.txt
          head -c 2000 /tmp/body.json || true
          echo

          if [ "$code" != '402' ]; then
            echo "ERROR: expected unpaid request to return HTTP 402"
            exit 1
          fi

          if ! grep -qiE '^payment-required:|^www-authenticate:' /tmp/headers.txt; then
            echo "ERROR: no x402 payment challenge header found"
            exit 1
          fi

          echo "LIVE_AGENT_WEB_EXTRACT_URL=$URL"
          echo "Agent Web Extract is live and payment-gated."
