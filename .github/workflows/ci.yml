name: Agent Web Extract CI
on:
  push:
    branches: [agent-web-extract-standalone]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm install
      - run: npm run typecheck
      - run: npm test
